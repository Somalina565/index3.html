<body>
  <main class="page">

    <h1>Етап 22: Grid (сітковий макет)</h1>
    <h2>Принцип: двовимірний макет</h2>
    <p>CSS Grid дає змогу керувати рядками та стовпцями одночасно.</p>
    <div class="grid-container">
      <div class="grid-item">Колонка 1</div>
      <div class="grid-item">Колонка 2</div>
      <div class="grid-item">Колонка 3</div>
      <div class="grid-item">Колонка 4</div>
    </div>
    <p>Перша колонка має фіксовану ширину 100px, а друга займає три частини доступного простору.</p>    <p class="back-note"><a href="index.html">Повернутися до головної сторінки</a></p>
  </main>
